name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    name: Test and pack
    runs-on: ubuntu-latest
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      version: ${{ steps.pack.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Check that the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --coverage
      - run: npx playwright-core install --with-deps --only-shell chromium
      - run: npm run test:browser
      - run: npm run build
      - run: npm run size
      - name: Pack
        id: pack
        run: |
          echo "tarball=$(npm pack --silent)" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: package
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          overwrite: true

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    # Add required reviewers to this environment in the repository settings.
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: package
      - name: Publish, unless this version is already on npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TARBALL: ${{ needs.verify.outputs.tarball }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          if npm view "@shieldlabs-ai/js@$VERSION" version > /dev/null 2>&1; then
            echo "@shieldlabs-ai/js@$VERSION is already on npm, nothing to publish."
          else
            npm publish "./$TARBALL" --provenance --access public
          fi
